name: Build R (debug APK)

on:
  push:
    branches:
      - build/r
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Android SDK
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleStandardDebug --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            python3 - <<'PYEOF'
          import re
          lines = open('build.log', errors='replace').read().splitlines()
          pat = re.compile(r'^e: |What went wrong|Execution failed|Could not |Caused by|error:|FAILURE')
          hits = [l for l in lines if pat.search(l)][:25]
          tail = lines[-25:]
          def enc(t):
              return t.replace('%','%25').replace('\r','%0D').replace('\n','%0A')[:3500]
          print('::error title=Gradle errors::' + enc('\n'.join(hits)))
          print('::error title=Gradle tail::' + enc('\n'.join(tail)))
          PYEOF
          fi
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yokai-r-debug
          path: app/build/outputs/apk/standard/debug/*universal*.apk
          if-no-files-found: error
