name: Build R (release APK)

on:
  push:
    branches:
      - build/r
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Android SDK
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Add swap (the minified release build is memory hungry)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -m

      - name: Build release APK
        run: |
          ./gradlew assembleStandardRelease -PrDebugSign=true --stacktrace > build.log 2>&1

      - name: Diagnostics (only when the build failed)
        if: failure()
        run: |
          free -m || true
          sudo dmesg 2>/dev/null | grep -i -E "out of memory|oom|killed process" | tail -5 || true
          python3 - <<'PYEOF'
          import re, os
          lines = open('build.log', errors='replace').read().splitlines() if os.path.exists('build.log') else []
          pat = re.compile(r'^e: |What went wrong|Execution failed|Could not |Caused by|error:|FAILURE|OutOfMemory|GC overhead')
          hits = [l for l in lines if pat.search(l)][:25]
          tail = lines[-25:]
          def enc(t):
              return t.replace('%','%25').replace('\r','%0D').replace('\n','%0A')[:3500]
          print('::error title=Gradle errors::' + enc('\n'.join(hits)))
          print('::error title=Gradle tail::' + enc('\n'.join(tail)))
          PYEOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yokai-r-release
          path: app/build/outputs/apk/standard/release/*universal*.apk
          if-no-files-found: error
